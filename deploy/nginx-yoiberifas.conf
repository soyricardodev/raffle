# nginx v2 — yoiberifas.com
# Reemplaza el bloque de /etc/nginx/sites-available/raffle-app cuando hagas cutover.
#
#   sudo cp deploy/nginx-yoiberifas.conf /etc/nginx/sites-available/raffle-app
#   sudo nginx -t && sudo systemctl reload nginx
#
# Antes del cutover: legacy sigue en :5001 + frontend estático.
# Después: todo va a TanStack Start en :3000, uploads sin mover.

upstream raffle_v2 {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    server_name yoiberifas.com www.yoiberifas.com;

    if ($host = www.yoiberifas.com) {
        return 301 https://yoiberifas.com$request_uri;
    }

    client_max_body_size 10m;

    # Misma carpeta que legacy — no copies archivos
    location /uploads/ {
        alias /home/admin/raffle-app/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://raffle_v2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/yoiberifas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yoiberifas.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name yoiberifas.com www.yoiberifas.com;
    return 301 https://$host$request_uri;
}

# ─── Prueba v2 en paralelo (opcional) ───────────────────────────────
# Expone v2 en puerto 3000 mientras legacy sigue en yoiberifas.com:
#   curl http://127.0.0.1:3000/api/health/db
# O añade server block con server_name v2.yoiberifas.com → proxy 3000
