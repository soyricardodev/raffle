# Publica la imagen de raffle a GHCR.
#
# Tags:
#   sha-<short>  → pin inmutable para producción (usar SIEMPRE este)
#   latest       → flotante, para staging/desarrollo
#
# La imagen se verifica ARRANCÁNDOLA antes de publicar. Un bundle roto compila
# sin quejarse y solo se nota al ejecutarse: el Dockerfile anterior llevaba
# meses construyendo una imagen que no arrancaba (ver el paso de smoke test).

name: Docker publish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Calcular tag
        id: meta
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build (sin publicar todavía)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: raffle-ci:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — la imagen tiene que arrancar y responder
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 3099:3000 \
            -e DATABASE_URL=file:/tmp/smoke.db \
            -e UPLOAD_DIR=/tmp/uploads \
            -e BETTER_AUTH_SECRET=smoke-test-secret-at-least-32-chars \
            -e BETTER_AUTH_URL=http://127.0.0.1:3099 \
            -e APP_URL=http://127.0.0.1:3099 \
            -e EMAIL_DISPATCH_ENABLED=false \
            -e EMAIL_PROVIDER=noop \
            -e EMAIL_VALIDATION_PROVIDER=none \
            -e LOG_LEVEL=warn \
            raffle-ci:verify

          ok=0
          for i in $(seq 1 30); do
            if curl -sf --max-time 3 http://127.0.0.1:3099/api/health/db | grep -q '"ok":true'; then
              ok=1
              echo "✅ /api/health/db respondió ok tras ${i} intento(s)"
              break
            fi
            sleep 2
          done
          if [[ "$ok" != "1" ]]; then
            echo "::error::La imagen no arrancó o no respondió el health check"
            docker logs smoke || true
            exit 1
          fi

          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:3099/)"
          echo "GET / -> HTTP ${code}"
          if [[ "$code" != "200" ]]; then
            echo "::error::GET / devolvió ${code} (un bundle roto responde 500)"
            docker logs smoke || true
            exit 1
          fi

      - name: Limpiar contenedor de prueba
        if: always()
        run: docker stop smoke 2>/dev/null || true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar
        run: |
          docker tag raffle-ci:verify "${IMAGE}:${{ steps.meta.outputs.sha }}"
          docker tag raffle-ci:verify "${IMAGE}:latest"
          docker push "${IMAGE}:${{ steps.meta.outputs.sha }}"
          docker push "${IMAGE}:latest"
          echo "Publicado:"
          echo "  ${IMAGE}:${{ steps.meta.outputs.sha }}"
          echo "  ${IMAGE}:latest"
