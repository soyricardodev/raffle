services:
  # ─── MySQL local para desarrollo ───────────────────────────
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: raffle_dev
      MYSQL_DATABASE: raffle_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    profiles:
      - dev

  # ─── App ───────────────────────────────────────────────────
  app:
    build: .
    image: ghcr.io/OWNER/raffle-v2:latest
    ports:
      - "3002:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - APP_URL=${APP_URL}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-noop}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ${UPLOAD_HOST_PATH:-./uploads}:/app/uploads
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  inngest:
    build: .
    image: ghcr.io/OWNER/raffle-v2:latest
    command: ["node", "inngest/start.mjs"]
    env_file:
      - .env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - jobs

volumes:
  mysql_data:
