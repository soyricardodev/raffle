services:
  app:
    build: .
    image: ghcr.io/OWNER/raffle-v2:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - APP_URL=${APP_URL}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-noop}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ${UPLOAD_HOST_PATH:-./uploads}:/app/uploads
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  inngest:
    build: .
    image: ghcr.io/OWNER/raffle-v2:latest
    command: ["node", "inngest/start.mjs"]
    env_file:
      - .env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - jobs
