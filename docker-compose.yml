services:
  # ─── App (opcional — alternativa: Bun + systemd en el host) ─────
  app:
    build: .
    image: ghcr.io/OWNER/raffle-v2:latest
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/raffle.db}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ${DATA_HOST_PATH:-./data}:/app/data
      - ${UPLOAD_HOST_PATH:-./uploads}:/app/uploads
    restart: unless-stopped

  inngest:
    build: .
    image: ghcr.io/OWNER/raffle-v2:latest
    command: ["node", "inngest/start.mjs"]
    env_file:
      - .env
    restart: unless-stopped
    profiles:
      - jobs

  # ─── MySQL solo para desarrollo local / pruebas de migración ─────
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: raffle_dev
      MYSQL_DATABASE: raffle_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    profiles:
      - dev

volumes:
  mysql_data:
